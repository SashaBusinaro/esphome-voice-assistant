wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # Full audio + TLS API needs deterministic Wi-Fi latency. ESP32 LIGHT power
  # save can leave the device associated while HA can no longer ARP it.
  power_save_mode: NONE
  manual_ip:
    static_ip: !secret wifi_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet