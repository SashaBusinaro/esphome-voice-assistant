external_components:
  - source: github://n-IA-hane/esphome-intercom@main
    components: [audio_processor, esp_audio_stack, esp_afe]
    refresh: 0s

i2c:
  id: i2c_bus
  scl: GPIO14
  sda: GPIO15
  frequency: 100kHz
  scan: false

# ---------------------------------------------------------------------------
# AFE pipeline — swap 3 lines to switch between dual-mic and single-mic:
#
#   DUAL-MIC (Speech Enhancement / BSS):
#     mic_num: 2  |  se_enabled: true  |  agc_enabled: false
#     esp_audio_stack: tdm_mic_slots: [0, 2]
#
#   SINGLE-MIC (NS + AGC, no spatial separation):
#     mic_num: 1  |  se_enabled: false  |  agc_enabled: true
#     esp_audio_stack: tdm_mic_slot: 0     <- singular key, replaces tdm_mic_slots
#     add agc switch below if desired
# ---------------------------------------------------------------------------
esp_afe:
  id: afe_processor
  type: sr              # linear AEC; best MWW detection (10/10 vs 2/10 with vc)
  mode: low_cost
  mic_num: 1            # DUAL-MIC: change to 1 for single-mic test
  aec_filter_length: 4  # 64 ms tail, sufficient for integrated codec
  aec_nlp_level: normal # normal / aggressive / very_aggressive
  se_enabled: false      # DUAL-MIC: set false for single-mic test (structural, needs reflash)
  ns_enabled: true      # active in single-mic; esp-sr may bypass when SE is active
  vad_enabled: false    # VA pipeline owns its own VAD
  agc_enabled: true    # DUAL-MIC: set true for single-mic test
  aec_off_output: raw_1 # AEC-off path: use BSS non-processed output on dual-mic SE builds
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: 0
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: 1
  fetch_task_priority: 5
  fetch_task_stack_size: 3072
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

esp_audio_stack:
  id: audio_stack
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  master_volume_min_db: -30.0
  task_core: 0
  task_priority: 19
  task_stack_size: 8192
  # dma_frame_num: 240 trims TDM DMA by ~23 KB; keep for headroom when display is re-enabled
  dma_frame_num: 240
  gmf_io:
    reader:
      io_size: 0
      buffer_size: 0
      task_stack_size: 0
      speed_monitor: false
    writer:
      io_size: 0
      buffer_size: 0
      task_stack_size: 0
      speed_monitor: false
  # Custom pin mapping for this board (differs from the library's stock WS3 example)
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO9
  i2s_mclk_pin: GPIO42
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F  # all 4 channels enabled (MIC1-4)
      gain_db: 24.0        # uniform 24 dB on all channels including AEC ref slot
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: 0    # DUAL-MIC: right mic (slot 0) + left mic (slot 2)
                            # SINGLE-MIC: replace with  tdm_mic_slot: 0  (singular key)
  tdm_ref_slot: 1           # slot 1 = DAC analog feedback for AEC (empirically verified)

microphone:
  - platform: esp_audio_stack
    id: microphone_aec
    esp_audio_stack_id: audio_stack

# Speaker pipeline at 48 kHz. The ESPHome mixer does NOT resample, so every
# source must already be at 48 kHz. Resampler speakers upconvert into the
# 48 kHz mixer sources.
speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: media_speaker_mix
        timeout: 10s
        buffer_duration: 100ms
      - id: va_speaker_mix
        timeout: 10s
        buffer_duration: 50ms

  - platform: resampler
    id: media_speaker
    output_speaker: media_speaker_mix
    task_stack_in_psram: true

  - platform: resampler
    id: va_speaker
    output_speaker: va_speaker_mix
    task_stack_in_psram: true

switch:
  - platform: gpio
    id: internal_speaker_amp
    pin: GPIO46
    restore_mode: ALWAYS_ON
    internal: true

  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON
    ns:
      id: ns_switch
      name: Noise Suppression
      icon: mdi:volume-off
      restore_mode: RESTORE_DEFAULT_ON
    # For single-mic test add agc switch here (requires agc_enabled: true above):
    agc:
      id: agc_switch
      name: Auto Gain Control
      icon: mdi:tune-vertical
      restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: microphone_mute
    name: "Microphone Mute"
    icon: "mdi:microphone-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(microphone_aec).get_mute_state();
    turn_on_action:
      - microphone.mute: microphone_aec
      - script.execute: update_leds
      # - script.execute: update_ui  # uncomment when ui.yaml is re-enabled
    turn_off_action:
      - microphone.unmute: microphone_aec
      - script.execute: update_leds
      # - script.execute: update_ui  # uncomment when ui.yaml is re-enabled

number:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    master_volume:
      id: master_volume
      name: "Master Volume"
      speaker_id: hw_speaker
    mic_gain:
      id: mic_gain
      name: "Mic Gain (post-AFE)"

sensor:
  - platform: esp_afe
    esp_afe_id: afe_processor
    input_volume:
      name: "AFE Input Volume"
      update_interval: 250ms
    output_rms:
      name: "AFE Output RMS"
      update_interval: 250ms
