# Local fork of n-IA-hane/esphome-intercom pinned at v2026.5.0 with two
# backported fixes (see components/README.md). Upstream 2026.6.x removed
# i2s_audio_duplex in favor of the GMF-based esp_audio_stack; with SE off this
# pipeline runs single-mic MR anyway, so a 6.x port is possible via mic_num: 1
# (see the audio-2026.6.2 branch for the comparison build).
external_components:
  - source:
      type: local
      path: components
    components: [audio_processor, i2s_audio_duplex, esp_afe]

i2c:
  id: i2c_bus
  scl: GPIO14
  sda: GPIO15
  frequency: 100kHz # Initialization stability
  scan: false

# 48 kHz I2S bus + FIR decimation x3 -> 16 kHz. The codec runs at its native
# 48 kHz (lower noise floor / better ADC-DAC per the i2s_audio_duplex README);
# mic / AEC / MWW / VA get 16 kHz via output_sample_rate. The speaker path runs
# at 48 kHz through resampler speakers into the mixer (see the speaker block
# below and core/va.yaml). Mirrors the official Waveshare full-AFE example.
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000
    use_mclk: true
    # No mic_gain here: the ES8311 is DAC-only on this board, all mics go
    # through the ES7210.

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 24dB

# Full Audio Front-End: AEC + NS + AGC (single-mic MR pipeline).
# SE disabled after A/B test: NS+AGC gives better wake-word + STT on this board.
esp_afe:
  id: afe_processor
  type: sr                # SR linear AEC, MWW compatible (10/10 detection)
  mode: low_cost
  mic_num: 2              # ES7210 TDM provides 2 voice slots; MR collapses to 1 AFE channel
  aec_filter_length: 4    # 64 ms tail
  se_enabled: false       # off -> AEC -> NS -> AGC (no spatial separation, AGC active)
  ns_enabled: true        # WebRTC NS active
  vad_enabled: false      # VA already runs its own VAD
  agc_enabled: true       # WebRTC AGC active: normalizes level + caps post-AFE clipping
  task_priority: 19
  # Staging buffer placement. With WiFi up and 77 KB internal free, the ~3 KB
  # feed scratch is cheap to keep internal: saves ~41 us/frame on Core 0 (the
  # buffer is written and re-read every audio frame). The bigger rings stay in
  # PSRAM where the bus penalty is amortised over fewer accesses.
  feed_buf_in_psram: false
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

i2s_audio_duplex:
  id: i2s_duplex
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO9
  i2s_mclk_pin: GPIO42
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8
  sample_rate: 48000          # I2S bus rate (codec native, cleaner ADC/DAC)
  output_sample_rate: 16000   # FIR decimate x3 -> 16 kHz for AEC/MWW/VA
  processor_id: afe_processor
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]       # MIC1 + MIC3 = dual voice mics
  tdm_ref_slot: 1             # MIC2 = DAC analog feedback @ 30 dB
  buffers_in_psram: true

# Microphone (post-AFE, 16 kHz mono)
microphone:
  - platform: i2s_audio_duplex
    id: microphone_aec
    i2s_audio_duplex_id: i2s_duplex

# Speaker pipeline at 48 kHz. The ESPHome mixer does NOT resample, so every
# source must already be at 48 kHz. The media_player and any local .flac (own
# native rate) feed resampler speakers (media_speaker / va_speaker) that
# upconvert into the 48 kHz mixer sources (media_speaker_mix / va_speaker_mix).
# Architecture from packages/audio/full_mono_mixer_48k.yaml.
speaker:
  - platform: i2s_audio_duplex
    id: hw_speaker
    i2s_audio_duplex_id: i2s_duplex
    sample_rate: 48000

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      # Media keeps 100 ms — music streams over the network and benefits from a
      # bit of jitter absorption. VA TTS arrives in a burst after HA finishes
      # generating it, so a smaller buffer reduces the gap between the first
      # received chunk and the first sample reaching the DAC.
      - id: media_speaker_mix
        timeout: 10s
        buffer_duration: 100ms
      - id: va_speaker_mix
        timeout: 10s
        buffer_duration: 50ms

  # Resamplers: media_player output / local files (any rate) -> 48 kHz mixer.
  - platform: resampler
    id: media_speaker
    output_speaker: media_speaker_mix
    task_stack_in_psram: true

  - platform: resampler
    id: va_speaker
    output_speaker: va_speaker_mix
    task_stack_in_psram: true

switch:
  - platform: gpio
    id: internal_speaker_amp
    pin: GPIO46
    restore_mode: ALWAYS_ON
    internal: true

  # AFE runtime controls (replace esp_aec single AEC switch)
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON
    se:
      id: se_switch
      name: Speech Enhancement
      icon: mdi:microphone-variant
      restore_mode: RESTORE_DEFAULT_OFF
    ns:
      id: ns_switch
      name: Noise Suppression
      icon: mdi:volume-off
      restore_mode: RESTORE_DEFAULT_ON
    agc:
      id: agc_switch
      name: Auto Gain Control
      icon: mdi:tune-vertical
      restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: microphone_mute
    name: "Microphone Mute"
    icon: "mdi:microphone-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(microphone_aec).get_mute_state();
    turn_on_action:
      - microphone.mute: microphone_aec
      - script.execute: update_leds
      - script.execute: update_ui
    turn_off_action:
      - microphone.unmute: microphone_aec
      - script.execute: update_leds
      - script.execute: update_ui

number:
  - platform: i2s_audio_duplex
    i2s_audio_duplex_id: i2s_duplex
    mic_gain:
      id: mic_gain
      name: "Mic Gain (post-AFE)"
    speaker_volume:
      id: master_volume
      name: "Master Volume"
      speaker_id: hw_speaker

# AFE diagnostic sensors
sensor:
  - platform: esp_afe
    esp_afe_id: afe_processor
    input_volume:
      name: "AFE Input Volume"
      update_interval: 250ms
    output_rms:
      name: "AFE Output RMS"
      update_interval: 250ms
