external_components:
  - source: github://n-IA-hane/esphome-intercom@v2026.5.0
    components: [audio_processor, i2s_audio_duplex, esp_afe]
    refresh: 0s

i2c:
  id: i2c_bus
  scl: GPIO14
  sda: GPIO15
  frequency: 100kHz # Initialization stability
  scan: false

# 16 kHz I2S bus everywhere: AFE operates natively at 16 kHz, no FIR decimation,
# no speaker resamplers. HA's ffmpeg_proxy resamples media on its side before
# streaming to the device (matches the original esp_aec configuration that
# worked reliably on this board).
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true
    mic_gain: 24DB

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

# Full Audio Front-End: AEC + Speech Enhancement (dual-mic) + NS + AGC
esp_afe:
  id: afe_processor
  type: sr                # SR linear AEC, MWW compatible (10/10 detection)
  mode: low_cost
  mic_num: 2              # Dual-mic Speech Enhancement
  aec_filter_length: 4    # 64 ms tail
  se_enabled: true        # Spatial source separation (replaces NS+AGC while active)
  ns_enabled: true        # WebRTC NS (used when SE is toggled off)
  vad_enabled: false      # VA already runs its own VAD
  agc_enabled: true       # WebRTC AGC (used when SE is toggled off)
  task_priority: 19
  # Place AFE staging buffers in PSRAM to keep internal RAM free for TLS / DMA.
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

i2s_audio_duplex:
  id: i2s_duplex
  i2s_lrclk_pin: GPIO45
  i2s_bclk_pin: GPIO9
  i2s_mclk_pin: GPIO42
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8
  sample_rate: 16000          # I2S bus rate; no FIR decimation needed
  processor_id: afe_processor
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]       # MIC1 + MIC3 = dual voice mics
  tdm_ref_slot: 1             # MIC2 = DAC analog feedback @ 30 dB
  buffers_in_psram: true

# Microphone (post-AFE, 16 kHz mono)
microphone:
  - platform: i2s_audio_duplex
    id: microphone_aec
    i2s_audio_duplex_id: i2s_duplex

# Speaker pipeline at 16 kHz: mixer combines media + VA TTS directly, no
# resamplers needed since HA sends both streams at 16 kHz (see core/va.yaml).
speaker:
  - platform: i2s_audio_duplex
    id: hw_speaker
    i2s_audio_duplex_id: i2s_duplex
    sample_rate: 16000

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      # Media keeps 100 ms — music streams over the network and benefits from a
      # bit of jitter absorption. VA TTS arrives in a burst after HA finishes
      # generating it, so a smaller buffer reduces the gap between the first
      # received chunk and the first sample reaching the DAC.
      - id: media_speaker
        timeout: 10s
        buffer_duration: 100ms
      - id: va_speaker
        timeout: 10s
        buffer_duration: 100ms

switch:
  - platform: gpio
    id: internal_speaker_amp
    pin: GPIO46
    restore_mode: ALWAYS_ON
    internal: true

  # AFE runtime controls (replace esp_aec single AEC switch)
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON
    se:
      id: se_switch
      name: Speech Enhancement
      icon: mdi:microphone-variant
      restore_mode: RESTORE_DEFAULT_ON
    ns:
      id: ns_switch
      name: Noise Suppression
      icon: mdi:volume-off
      restore_mode: RESTORE_DEFAULT_ON
    agc:
      id: agc_switch
      name: Auto Gain Control
      icon: mdi:tune-vertical
      restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: microphone_mute
    name: "Microphone Mute"
    icon: "mdi:microphone-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(microphone_aec).get_mute_state();
    turn_on_action:
      - microphone.mute: microphone_aec
      - script.execute: update_leds
      - script.execute: update_ui
    turn_off_action:
      - microphone.unmute: microphone_aec
      - script.execute: update_leds
      - script.execute: update_ui

number:
  - platform: i2s_audio_duplex
    i2s_audio_duplex_id: i2s_duplex
    mic_gain:
      id: mic_gain
      name: "Mic Gain (post-AFE)"
    speaker_volume:
      id: master_volume
      name: "Master Volume"
      speaker_id: hw_speaker

# AFE diagnostic sensors
sensor:
  - platform: esp_afe
    esp_afe_id: afe_processor
    input_volume:
      name: "AFE Input Volume"
      update_interval: 250ms
    output_rms:
      name: "AFE Output RMS"
      update_interval: 250ms
