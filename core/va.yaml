media_player:
  - platform: speaker
    id: speaker_media_player
    name: "Media Player"
    volume_increment: 0.05
    volume_min: 0.55
    volume_max: 0.85
    media_pipeline:
      speaker: media_speaker
      sample_rate: 48000
      format: FLAC
    announcement_pipeline:
      speaker: va_speaker
      sample_rate: 48000
      format: FLAC
    on_state:
      - script.execute: update_leds
      - script.execute: update_ui

# Post-AFE mic is already cleaned (AEC + SE + NS + AGC).
# No channel/gain filter wrapper needed; tune via the "Mic Gain (post-AFE)"
# number from i2s_audio_duplex if extra trim is required.
micro_wake_word:
  id: mww
  microphone: microphone_aec
  stop_after_detection: false
  models:
    # Aggressive sensitivity: single-frame trigger above 0.7. Validated
    # on-device: fast detection with no false positives observed in testing.
    # Tune up (e.g. window 2-3) if false triggers appear in noisy conditions.
    - model: github://esphome/micro-wake-word-models/models/okay_nabu.json@main
      probability_cutoff: 0.7
      sliding_window_size: 1
  on_wake_word_detected:
    then:
      - voice_assistant.start:
          # Passes the detected wake word to Home Assistant
          wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: microphone_aec
  media_player: speaker_media_player
  micro_wake_word: mww
  # AFE already runs NS + AGC; keep VA-side processing off to avoid double-filtering.
  noise_suppression_level: 0
  auto_gain: 0 dBFS
  volume_multiplier: 1.0 # Changing has no effect
  
  on_client_connected:
    # Home Assistant connected and waiting for commands.
    - logger.log: "[VA] Client connected"
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: update_leds
    - script.execute: update_ui
  on_client_disconnected:
    # Home Assistant disconnected.
    # NOTE: this trigger fires inside ~APIConnection() / APIServer teardown.
    # Any action that publishes state (logger.log -> on_log, light call ->
    # on_light_update) re-enters the APIServer on the client being destroyed
    # and crashes with LoadProhibited (confirmed twice via crash backtrace:
    # first through logger, then through update_leds' LightCall::perform).
    # The leading delay defers the whole action list to the next loop
    # iteration, outside the teardown stack.
    - delay: 10ms
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: update_leds
    - script.execute: update_ui
  on_intent_start:
    # Intent processing started.
    - logger.log: "[VA] Intent started"
  on_intent_progress:
    # Intent progress update (e.g., TTS URL received).
    - logger.log: "[VA] Intent progress"
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: update_leds
          - script.execute: update_ui
  on_intent_end:
    # Intent processing finished.
    - logger.log: "[VA] Intent ended"
  on_listening:
    # Microphone started listening.
    - logger.log: "[VA] Listening"
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: update_leds
    - script.execute: update_ui
  on_start:
    # Assist pipeline started.
    - logger.log: "[VA] Started"
    # Duck media audio when the voice assistant starts.
    # Ducking targets a mixer source; media_speaker is now a resampler that
    # feeds media_speaker_mix on the 48 kHz mixer.
    - mixer_speaker.apply_ducking:
        id: media_speaker_mix
        decibel_reduction: 30
        duration: 0.0s
  on_wake_word_detected:
    # Wake word detected.
    - logger.log: "[VA] Wake word detected"
  on_end:
    # Voice assistant finished all tasks.
    - logger.log: "[VA] Ended"
    - if:
        condition:
          # Phase still "thinking" here means the run ended without any TTS
          # (HassNevermind: "no"/"annulla"). In that flow RUN_END usually
          # arrives while the mic is still stopping; the upstream handler only
          # maps the streaming states and AWAITING_RESPONSE itself back to
          # IDLE, so the component parks in AWAITING_RESPONSE forever —
          # is_running never clears and request_start ignores the next wake
          # word. While the mic is stopping, request_stop() redirects the
          # desired state to IDLE, so stop here instead of waiting.
          lambda: return id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};
        then:
          - voice_assistant.stop:
        else:
          # TTS path: block until playback finishes so the replying UI persists.
          - wait_until:
              not:
                voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_speaker_mix
        decibel_reduction: 0
        duration: 0.5s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: update_leds
    - script.execute: update_ui
  on_stt_vad_start:
    # Voice activity detection (VAD) started STT processing.
    - logger.log: "[VA] STT VAD started"
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    # - script.execute: update_leds
  on_stt_vad_end:
    # Voice activity detection (VAD) ended STT processing.
    - logger.log: "[VA] STT VAD ended"
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: update_leds
    - script.execute: update_ui
  on_stt_end:
    # Speech-to-Text finished (text in 'x').
    - logger.log: "[VA] STT ended"
  on_tts_start:
    # Text-to-Speech started (text in 'x').
    - logger.log: "[VA] TTS started"
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: update_leds
          - script.execute: update_ui
  on_tts_end:
    # Text-to-Speech finished (audio URL in 'x').
    - logger.log: "[VA] TTS ended"
  on_idle:
    - logger.log: "[VA] Idle"
  on_error:
    # Error encountered (code and message available).
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - logger.log: "[VA] Error"
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: update_leds
          - script.execute: update_ui