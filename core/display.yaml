spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    brightness: 255
    reset_pin: GPIO39
    cs_pin: GPIO12
    update_interval: never
    dimensions:
      height: 466
      width: 466
      offset_width: 6  # UE015WV-RB24-A021A has 6-pixel horizontal offset
    color_depth: 16
    # Partial-frame buffer: full-frame (100%) at 466x466x16bpp consumes ~434 KB
    # and drags ~75 KB of DMA-capable internal RAM with it for the QSPI staging
    # path. That left esp_wifi_init() with a 20 KB largest contiguous DMA block
    # (needs ~40-60 KB) once AFE was added. 25% = ~108 KB PSRAM-resident frame
    # with proportionally smaller internal DMA scratch.
    buffer_size: 25%

    # Display initialization sequence
    init_sequence:
      - [ 0xD0, 0x07, 0x42, 0x18]  # Gamma correction positive
      - delay 10ms
      - [ 0xD1, 0x00, 0x07, 0x10]  # Gamma correction negative
      - delay 10ms

light:
  - platform: monochromatic
    id: display_backlight
    name: "Backlight"
    output: backlight_brightness
    default_transition_length:
      milliseconds: 0
    initial_state:
      brightness: 100%
    restore_mode:
      ALWAYS_ON

output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      then:
        - lambda: |-
            id(disp1).set_brightness(state*255);
