spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    # Default is 10 MHz (~5 MB/s on quad): a full-ring redraw (~774 KB) took
    # ~200 ms and blocked the main loop. CO5300 handles 40 MHz QSPI writes
    # (Waveshare demos run it at 40+); if artifacts appear, fall back to 20MHz.
    data_rate: 40MHz
    brightness: 255
    reset_pin: GPIO39
    cs_pin: GPIO12
    update_interval: never
    dimensions:
      height: 466
      width: 466
      offset_width: 6  # UE015WV-RB24-A021A has 6-pixel horizontal offset
    color_depth: 16
    # No buffer_size here on purpose: this display is driven by LVGL
    # (lvgl.displays: [disp1]), so the mipi_spi driver allocates NO buffer of
    # its own — LVGL owns the single draw buffer. The effective frame buffer is
    # lvgl.buffer_size in core/ui.yaml (10% = ~43 KB DMA-capable internal). A
    # buffer_size here would be inert; the RAM/WiFi-DMA tradeoff lives in ui.yaml.

    # Display initialization sequence
    init_sequence:
      - [ 0xD0, 0x07, 0x42, 0x18]  # Gamma correction positive
      - delay 10ms
      - [ 0xD1, 0x00, 0x07, 0x10]  # Gamma correction negative
      - delay 10ms

light:
  - platform: monochromatic
    id: display_backlight
    name: "Backlight"
    output: backlight_brightness
    default_transition_length:
      milliseconds: 0
    initial_state:
      brightness: 100%
    restore_mode:
      ALWAYS_ON

output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      then:
        - lambda: |-
            id(disp1).set_brightness(state*255);
