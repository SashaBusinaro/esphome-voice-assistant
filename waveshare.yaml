substitutions:
  name: "waveshare"
  friendly_name: "Waveshare"
  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'
  
  # LED Brightness
  led_brightness_low: "0.4f"
  led_brightness_high: "0.6f"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    - priority: 200
      then:
        - lambda: |-
            // 1. Enable ALL ADC clocks (ESPHome driver only enables ADC1+2)
            uint8_t reg01;
            if (!id(es7210_adc).read_byte(0x01, &reg01)) {
              ESP_LOGE("es7210_tdm", "Failed to read reg 0x01, TDM config aborted");
              return;
            }
            reg01 &= ~0x3F;  // Clear bits 0-5: enable ADC1-4 clocks + CP + BCLK
            
            if (!id(es7210_adc).write_byte(0x01, reg01) ||
                !id(es7210_adc).write_byte(0x12, 0x02)) {  // Enable TDM I2S mode
              ESP_LOGE("es7210_tdm", "Failed to write clock/TDM registers");
              return;
            }

            // 2. Set gains
            if (!id(es7210_adc).write_byte(0x43, 0x18) ||  // MIC1: 24dB
                !id(es7210_adc).write_byte(0x44, 0x1A) ||  // MIC2 (AEC Reference): 30dB
                !id(es7210_adc).write_byte(0x45, 0x18)) {  // MIC3: 24dB
              ESP_LOGE("es7210_tdm", "Failed to write MIC gain registers");
              return;
            }

            ESP_LOGI("es7210_tdm", "TDM config applied successfully!");
            // Heap diagnostics — helps verify SPIRAM_USE_MALLOC is routing large
            // allocations (LVGL draw buf 106KB) to PSRAM and freeing internal SRAM for I2S DMA.
            ESP_LOGI("heap", "Internal free: %u  DMA free: %u  DMA largest: %u  PSRAM free: %u",
                (unsigned)heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                (unsigned)heap_caps_get_free_size(MALLOC_CAP_DMA | MALLOC_CAP_INTERNAL),
                (unsigned)heap_caps_get_largest_free_block(MALLOC_CAP_DMA | MALLOC_CAP_INTERNAL),
                (unsigned)heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
        - script.execute: update_leds
        - script.execute: update_ui

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      # esp-sr (AFE) requires 64KB data cache with 64B line on S3.
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # Move code/rodata to PSRAM XIP, frees ~30KB internal DRAM.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Keep TLS allocations out of internal RAM.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"
      CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN: "16384"
      # Switch from CAPS_ALLOC to USE_MALLOC so malloc() can use PSRAM.
      # CAPS_ALLOC (ESPHome default) keeps malloc() internal-only; LVGL's malloc(106KB) draw
      # buffer then exhausts the internal heap before I2S DMA can allocate its 64KB.
      # With USE_MALLOC + ALWAYSINTERNAL=16384: allocations >16KB go to PSRAM via malloc(),
      # task stacks ≤8KB stay internal, heap_caps_malloc(DMA|INTERNAL) is always unaffected.
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384" # malloc() >16KB → PSRAM; ≤16KB → internal
      # NOTE: CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP intentionally removed.
      # With the esp_afe pipeline the audio task generates heavy PSRAM bus
      # traffic on Core 0; sharing that bus with WiFi/LWIP buffers caused
      # esp_wifi_init() to fail (scan timeout → ESP_ERR_WIFI_NOT_INIT).
      # Keeping WiFi/LWIP in internal RAM matches the library's AFE reference
      # configuration (yamls/full-experience/single-bus/afe/*.yaml).

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false # Higher performance optimization settings for networking

network:
  enable_high_performance: true

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: WARN

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  wifi: !include core/wifi.yaml
  audio: !include core/audio.yaml
  va: !include core/va.yaml
  led: !include core/led.yaml
  display: !include core/display.yaml
  touchscreen: !include core/touchscreen.yaml
  ui: !include core/ui.yaml

globals:
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'

button:
  - platform: restart
    name: "Reboot"

