name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'waveshare.yaml'
      - 'core/**'
      - 'components/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'waveshare.yaml'
      - 'core/**'
      - 'components/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build waveshare.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      # secrets.yaml is gitignored, so provide throwaway values just to let the
      # config compile. The real secrets live only on the local build machine.
      - name: Create dummy secrets for CI
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-dummy-ssid"
          wifi_password: "ci-dummy-password"
          wifi_static_ip: "192.168.1.50"
          wifi_gateway: "192.168.1.1"
          wifi_subnet: "255.255.255.0"
          api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          ota_password: "ci-dummy-ota"
          EOF

      - name: Build firmware
        uses: esphome/build-action@v7
        with:
          yaml-file: waveshare.yaml
          version: 2026.5.3
